databaseChangeLog:
  - changeSet:
      id: 002-create-outbox-table
      author: serj
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: request_event_id
                  type: VARCHAR(255)
              - column:
                  name: event_type
                  type: VARCHAR(255)
              - column:
                  name: payload
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    checkConstraint: "status IN ('PENDING', 'SENT')"
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE